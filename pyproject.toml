[project]
name = "card-checkout-bot"
version = "0.1.0"
description = "Automated checkout bot for trading card websites"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "playwright>=1.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "2captcha-python>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
cardbot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
